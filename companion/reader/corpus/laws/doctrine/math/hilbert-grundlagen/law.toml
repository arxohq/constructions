# Манифест §10 — маркер корня пакета (DECISION-0033). Нормативны заголовки §22
# в самих .law; манифест обязан с ними совпадать (LDC-E1109, lawc check).
#
# ПЕРВЫЙ АКТ КОРПУСА, ГДЕ ПРЕДМЕТ ЕСТЬ АКСИОМАТИКА, А ВОПРОС — «МОДЕЛЬ ЛИ
# ЭТО». Аксиома здесь не правило, а инвариант §93.1: она ничего не выводит,
# она отсекает конфигурации, и её исход — SATISFIED / VIOLATED /
# UNDETERMINED с подстановкой в узле доказательства, то есть с ответом «на
# какой тройке точек». Конечность предъявленной модели вводит замыкания §70:
# без них «прямая не проходит через точку» не выводится вовсе (§93.2), и
# аксиома Паша не имеет ни одной применимой подстановки. Разбор —
# audit.ru.md.
#
# ЗАКРЕПЛЁН АВТОРИЗОВАННЫЙ ПЕРЕВОД, А НЕ НЕМЕЦКИЙ ПОДЛИННИК, И ЭТО ИЗМЕРЕНО,
# А НЕ ВЫБРАНО: вычитанного немецкого набора не существует, а все три
# доступных распознавания первого издания портят аксиомы групп I—II, каждое
# по-своему (в экземпляре Wellesley — имена точек в II 2 и II 4, в обоих
# сканах Google — ярлыки групп). Замер воспроизводим ключом `--collate`
# закрепляющего скрипта; разбор — шапка `sources.law`.

[package]
name = "de.hilbert.grundlagen"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:hilbert:clir:grundlagen"

# Каталожная метадата (DECISION-0051; docs/PACKAGE-METADATA.ru.md). НЕ семантика:
# в CLIR не понижается, в semantic hash §209 не входит. Выводимые поля
# (jurisdiction ← jurisdiction источника, instrument ← kind, sourceFidelity ←
# materialization_status, primarySource ← существование декларации) сверяются
# воротами verify/ci/gates/coverage/check_package_metadata.py.
[metadata]
act = "de-hilbert-grundlagen"
title = "«Основания геометрии» Гильберта (Festschrift 1899), группы аксиом I, II и III: инварианты предъявленной конечной конфигурации точек, прямых и плоскостей"
primarySource = "GRUNDLAGEN_DER_GEOMETRIE"

# Выводимые. Совпадение с sources.law держат ворота, а не эти строки.
jurisdiction = "none"
instrument = "treatise"
sourceFidelity = "pinned_unofficial_copy"

# Невыводимые — не сверяет никто, поэтому у каждого записана причина.
#
# issuer: у математического сочинения нет издателя в том смысле, в каком он
# есть у закона. Названо то, что известно и проверяемо: Гильберт написал
# работу для Festschrift'а к открытию памятника Гауссу и Веберу, напечатал её
# первым отделом сборника Teubner (Лейпциг, 1899), а закреплённые байты несёт
# авторизованный перевод Э. Дж. Таунсенда (Open Court, 1902; репринт 1950) в
# наборе Project Gutenberg — то есть между автором и байтами стоят двое, и
# оба названы.
issuer = "Д. Гильберт для Festschrift-комитета Гёттингена; печать B. G. Teubner, Лейпциг, 1899; закреплённая копия — авторизованный перевод Э. Дж. Таунсенда, The Open Court Publishing Co., 1902 (репринт 1950), набор Project Gutenberg"
# legalStatus: словарь схемы закрыт, и «математический трактат» в нём
# отсутствует — выбирается ближайшее верное, а не изобретается новое.
# `doctrine` означает здесь ровно одно: текст говорит, что из чего следует, и
# никого ни к чему не обязывает. Чего он НЕ означает: `historical_monument`
# сказал бы «памятник, переставший действовать», а аксиомы соединения и
# порядка не «перестали действовать» — они не действовали и не переставали,
# потому что не были установлением.
legalStatus = "doctrine"
# verifiedAgainstSource: официального текста у математического сочинения не
# существует, и сверять фрагменты не с чем — поэтому `false`, а не забытое
# поле. Тексты фрагментов при этом вырезаются из закреплённых байтов
# генератором и сверяются с публикацией §194 на каждом `lawc check`; сами
# байты сверены с двумя независимыми распознаваниями немецкого первого
# издания по двадцати строкам-ярлыкам аксиом (ключ `--collate` закрепляющего
# скрипта), и расхождения этих распознаваний между собой записаны. То есть
# проверено ВСЁ, что здесь проверяемо; `true` говорило бы о сверке с
# официальным текстом, которой не бывает.
verifiedAgainstSource = false

# Рукописные сценарии пакета: исполняются общим раннером,
# в учёт покрытия регрессии не входят.
[[tests]]
family = "de.hilbert.grundlagen#authored"
regression = false
suites = ["tests/01-gerade-meidet-punkt.lawtest", "tests/02-zwei-geraden-fallen-zusammen.lawtest", "tests/03-dreieck-aus-zwei-abschluessen.lawtest", "tests/04-book-point-outside-figure.lawtest", "tests/05-book-point-declared-without-incidence.lawtest", "tests/06-playfair-eine-parallele.lawtest", "tests/07-playfair-zwei-parallelen.lawtest"]
world = ["de.hilbert.grundlagen"]
